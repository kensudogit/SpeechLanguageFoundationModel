name: speech-language-foundation-model

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: speech
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speech}
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speech"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://speech:${POSTGRES_PASSWORD:-speech}@db:5432/speech
      ASR_PROVIDER: ${ASR_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      FRONTEND_ORIGIN: http://localhost:3000
      RETENTION_HOURS: ${RETENTION_HOURS:-168}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  pgdata:
